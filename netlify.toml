[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/triage"
  to = "/.netlify/functions/triage"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"